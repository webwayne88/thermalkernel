[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "thermalkernel"
version = "0.1.0"
description = "Детерминированное расчётное ядро тепловой защиты зданий по СП 50.13330.2012"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[project.scripts]
thermalkernel = "thermalkernel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["thermalkernel*"]

[tool.setuptools.package-data]
thermalkernel = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
